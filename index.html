    <script>
        // Auto-hide loading screen after timeout (in case React fails to mount)
        setTimeout(function() {
            var ls = document.getElementById('loadingScreen');
            if (ls && !ls.classList.contains('hidden')) {
                ls.classList.add('hidden');
                document.getElementById('loadingMsg').textContent = 'Taking longer than expected — check your internet connection and reload.';
            }
        }, 12000);
        // Global error handler
        window.onerror = function(msg, url, line, col, err) {
            var es = document.getElementById('errorScreen');
            var em = document.getElementById('errorMsg');
            if (es && em) {
                em.textContent = (err && err.stack) || msg + ' (at ' + url + ':' + line + ':' + col + ')';
                es.style.display = 'flex';
                es.style.alignItems = 'center';
                es.style.justifyContent = 'center';
                es.style.flexDirection = 'column';
                document.getElementById('loadingScreen').classList.add('hidden');
            }
        };
    </script>

        function deepMerge(base, over) {
            if (over === undefined || over === null) return base;
            if (Array.isArray(base) || Array.isArray(over)) return over;
            if (typeof base !== 'object' || typeof over !== 'object') return over;
            const out = Object.assign({}, base);
            Object.keys(over).forEach(function (k) { out[k] = deepMerge(base[k], over[k]); });

        function useScrollReveal() {
            useEffect(() => {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
                }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });
                document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
                return () => observer.disconnect();
            }, []);
        }

        function useTypingAnimation(words, typingSpeed=80, deletingSpeed=40, pauseTime=2000) {
            const [text, setText] = useState('');
            const [isDeleting, setIsDeleting] = useState(false);
            const [wordIdx, setWordIdx] = useState(0);

            useEffect(() => {
                const current = words[wordIdx] || '';
                let timeout;
                if (!isDeleting) {
                    if (text.length < current.length) {
                        timeout = setTimeout(() => setText(current.slice(0, text.length + 1)), typingSpeed);
                    } else {
                        timeout = setTimeout(() => setIsDeleting(true), pauseTime);
                    }
                } else {
                    if (text.length > 0) {
                        timeout = setTimeout(() => setText(text.slice(0, -1)), deletingSpeed);
                    } else {
                        setIsDeleting(false);
                        setWordIdx((wordIdx + 1) % words.length);
                    }
                }
                return () => clearTimeout(timeout);
            }, [text, isDeleting, wordIdx, words, typingSpeed, deletingSpeed, pauseTime]);

            return text;
        }

        function useScrollProgress() {
            useEffect(() => {
                const bar = document.getElementById('scrollProgress');
                const handler = () => {
                    const h = document.documentElement.scrollHeight - window.innerHeight;
                    bar.style.width = h > 0 ? (window.scrollY / h * 100) + '%' : '0%';
                };
                window.addEventListener('scroll', handler);
                return () => window.removeEventListener('scroll', handler);
            }, []);
        }

        function useParticles() {
            useEffect(() => {
                const canvas = document.getElementById('particleCanvas');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animId;
                const particles = [];
                const count = 60;

                function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
                resize();
                window.addEventListener('resize', resize);

                for (let i = 0; i < count; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        vx: (Math.random() - 0.5) * 0.5,
                        vy: (Math.random() - 0.5) * 0.5,
                        r: Math.random() * 2 + 1,
                    });
                }

                function draw() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    const isDark = document.documentElement.classList.contains('dark');
                    particles.forEach((p, i) => {
                        p.x += p.vx;
                        p.y += p.vy;
                        if (p.x < 0) p.x = canvas.width;
                        if (p.x > canvas.width) p.x = 0;
                        if (p.y < 0) p.y = canvas.height;
                        if (p.y > canvas.height) p.y = 0;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                        ctx.fillStyle = isDark ? 'rgba(59,130,246,0.3)' : 'rgba(59,130,246,0.15)';
                        ctx.fill();
                        for (let j = i + 1; j < particles.length; j++) {
                            const dx = p.x - particles[j].x, dy = p.y - particles[j].y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < 150) {
                                ctx.beginPath();
                                ctx.moveTo(p.x, p.y);
                                ctx.lineTo(particles[j].x, particles[j].y);
                                ctx.strokeStyle = isDark ? `rgba(59,130,246,${0.15 * (1 - dist / 150)})` : `rgba(59,130,246,${0.08 * (1 - dist / 150)})`;
                                ctx.lineWidth = 0.5;
                                ctx.stroke();
                            }
                        }
                    });
                    animId = requestAnimationFrame(draw);
                }
                draw();
                return () => { cancelAnimationFrame(animId); window.removeEventListener('resize', resize); };
            }, []);
        }

        function SkillBar({ name, percentage }) {
            const [visible, setVisible] = useState(false);
            const ref = useRef();

            useEffect(() => {
                const el = ref.current;
                if (!el) return;
                const obs = new IntersectionObserver(([e]) => {
                    if (e.isIntersecting) { setVisible(true); obs.unobserve(e.target); }
                }, { threshold: 0.3 });
                obs.observe(el);
                return () => obs.disconnect();
            }, []);

            return (
                <div ref={ref}>
                    <div className="flex justify-between items-center mb-1.5">
                        <span className="text-sm font-medium dark:text-slate-300 text-slate-600">{name}</span>

        function useAdminEditor(initialItems, onSave) {
            const [items, setItems] = useState(initialItems);
            const [editing, setEditing] = useState(null);
            const [showForm, setShowForm] = useState(false);
            const itemsRef = useRef(initialItems);
            const reset = () => { setEditing(null); setShowForm(false); };
            const add = () => { setEditing({}); setShowForm(true); };
            const edit = (item) => { setEditing({...item}); setShowForm(true); };
            const del = (idx) => {
                if (!confirm('Delete this item?')) return;
                const next = items.filter((_, i) => i !== idx);
                setItems(next);
                onSave(next);
                showToast('Deleted!');
            };
            const saveItem = (item) => {
                const clean = Object.assign({}, item);
                const idx = clean._idx;
                delete clean._idx;
                let next;
                if (idx !== undefined) {
                    next = items.map((it, i) => i === idx ? clean : it);
                } else {
                    next = [...items, clean];
                }
                setItems(next);
                onSave(next);
                reset();
                showToast('Saved!');
            };
            useEffect(() => {
                if (JSON.stringify(initialItems) !== JSON.stringify(itemsRef.current)) {
                    itemsRef.current = initialItems;
                    setItems(initialItems);
                }
            }, [initialItems]);
            return { items, editing, showForm, add, edit, del, saveItem, setShowForm, setEditing, reset };
        }

                } else {
                    next = [...cats, { name: catForm.name, items: [] }];

                updateData({ ...data, skills: next });
                setShowCatForm(false); setEditingCat(null); setCatForm({ name: '' });
                showToast('Category saved!');
            };

            const saveSkill = () => {
                let next = [...cats];
                const items = [...(next[targetCat].items || [])];
                if (editingSkill !== null) {
                    items[editingSkill] = { name: skillForm.name, pct: Number(skillForm.pct) };
                } else {
                    items.push({ name: skillForm.name, pct: Number(skillForm.pct) });

        // --- persistence helpers ---
        function downloadFile(filename, text, mime) {
            const blob = new Blob([text], { type: mime || 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 200);
        }

        // Locates the DEFAULT_DATA object literal by bracket matching (ignores
        // braces inside strings) and swaps it for the supplied data.
        // Only ever looks inside <script type="text/babel"> blocks, and requires
        // an object literal to follow, so string literals and Babel's injected
        // compiled copy of the source elsewhere in the document are ignored.
        function bakeDataIntoHtml(html, newData) {
            const marker = 'const DEFAULT_DATA = {';
            const scriptRe = /<script type="text\/babel">/g;
            // Built from parts: a literal closing script tag here would end
            // this very script block when the HTML is parsed.
            const scriptClose = '<' + '/script>';
            let sm;
            while ((sm = scriptRe.exec(html)) !== null) {
                const regionStart = sm.index + sm[0].length;
                const regionEnd = html.indexOf(scriptClose, regionStart);
                if (regionEnd === -1) continue;
                const start = html.indexOf(marker, regionStart);
                if (start === -1 || start > regionEnd) continue;

                const objStart = start + marker.length - 1;
                let depth = 0, i = objStart, inStr = false, quote = '', esc = false;
                for (; i < regionEnd; i++) {
                    const ch = html[i];
                    if (inStr) {
                        if (esc) { esc = false; continue; }
                        if (ch === '\\') { esc = true; continue; }
                        if (ch === quote) inStr = false;
                        continue;
                    }
                    if (ch === '"' || ch === "'" || ch === '`') { inStr = true; quote = ch; continue; }
                    if (ch === '{') depth++;
                    else if (ch === '}') { depth--; if (depth === 0) { i++; break; } }
                }
                if (depth !== 0) continue;

                // Sanity check: a real object literal should be followed by ';'
                const after = html.slice(i, i + 40).match(/^\s*;/);
                if (!after) continue;

                return html.slice(0, objStart) + JSON.stringify(newData, null, 4) + html.slice(i);
            }
            throw new Error('Could not find the DEFAULT_DATA block in the HTML.');
        }

        // Builds a clean source file from the live DOM. Needed when the page was
        // opened straight from disk, where the browser blocks reading the file.
        // Undoes everything the running app did to the document.
        function buildHtmlFromDom() {
            const clone = document.documentElement.cloneNode(true);

            clone.querySelectorAll('script').forEach(function (s) {
                const parent = s.parentNode;
                const inHead = parent && parent.nodeName === 'HEAD';
                const text = s.textContent || '';
                // Babel injects a compiled copy of the source into <head>
                if (inHead && text.indexOf('DEFAULT_DATA') !== -1) s.remove();
            });

            const root = clone.querySelector('#root');
            if (root) root.innerHTML = '';

            const toast = clone.querySelector('#toast');
            if (toast) { toast.className = 'toast glass-card'; toast.textContent = ''; }

            // The loader is hidden by a class once React mounts; start it visible again.
            const loading = clone.querySelector('#loadingScreen');
            if (loading) loading.className = '';

            // The error overlay is hidden by an inline style, not a class.
            const errorScreen = clone.querySelector('#errorScreen');
            if (errorScreen) {
                errorScreen.setAttribute('style', 'display:none;');
                const msg = errorScreen.querySelector('#errorMsg');
                if (msg) msg.textContent = '';
            }

            return '<!DOCTYPE html>\n' + clone.outerHTML;
        }

        function AdminDataManager({ data, updateData }) {
            const [busy, setBusy] = useState('');
            const [status, setStatus] = useState(null);
            const fileRef = useRef();

            const exportJSON = () => {
                downloadFile('portfolio-data.json', JSON.stringify(data, null, 4), 'application/json');
                setStatus({ type: 'ok', text: 'portfolio-data.json downloaded.' });
                showToast('Data exported!');
            };

            const copyJSON = () => {
                const text = JSON.stringify(data, null, 4);
                const done = () => { setStatus({ type: 'ok', text: 'Copied to clipboard.' }); showToast('Copied to clipboard!'); };
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(done).catch(() => fallback());
                } else fallback();
                function fallback() {
                    const ta = document.createElement('textarea');
                    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
                    document.body.appendChild(ta); ta.select();
                    try { document.execCommand('copy'); done(); }
                    catch (e) { setStatus({ type: 'err', text: 'Could not copy. Use Export instead.' }); }
                    ta.remove();
                }
            };

            const importJSON = (file) => {
                const reader = new FileReader();
                reader.onload = () => {
                    try {
                        const parsed = JSON.parse(String(reader.result));
                        if (!parsed || typeof parsed !== 'object') throw new Error('Not a valid data object.');
                        updateData(deepMerge(data, parsed));
                        setStatus({ type: 'ok', text: 'Imported and merged into your site data.' });
                        showToast('Data imported!');
                    } catch (e) {
                        setStatus({ type: 'err', text: 'Import failed: ' + e.message });
                    }
                };
                reader.readAsText(file);
            };

            const downloadHTML = async () => {
                setBusy('html');
                setStatus(null);
                try {
                    let html = null;
                    let fromDOM = false;
                    try {
                        const res = await fetch(window.location.href, { cache: 'no-store' });
                        if (res.ok) html = await res.text();
                    } catch (e) { html = null; }
                    if (!html) {
                        fromDOM = true;
                        html = buildHtmlFromDom();
                    }
                    const out = bakeDataIntoHtml(html, data);
                    downloadFile('index.html', out, 'text/html');
                    setStatus({
                        type: fromDOM ? 'warn' : 'ok',
                        text: fromDOM
                            ? 'index.html downloaded. Your browser blocked reading the original file, so it was rebuilt from the live page (compiled duplicates and runtime markup removed).'
                            : 'index.html downloaded with your data baked in as the new defaults.',
                    });
                    showToast('index.html downloaded!');
                } catch (e) {
                    setStatus({ type: 'err', text: 'Could not build the file: ' + e.message });
                }
                setBusy('');
            };

            const clearOverride = () => {
                if (!confirm('Clear the data saved in this browser? The site will fall back to the defaults baked into the file.')) return;
                try {
                    localStorage.removeItem(STORAGE_KEY);
                    localStorage.removeItem('portfolio-theme');
                } catch {}
                window.location.reload();
            };

            const resetDefaults = () => {
                if (!confirm('Reset every section back to the original defaults? This cannot be undone.')) return;
                updateData(DEFAULT_DATA);
                setStatus({ type: 'ok', text: 'All sections reset to defaults. Download the file to make it permanent.' });
                showToast('Reset to defaults!');
            };

            const counts = [
                ['Projects', (data.projects || []).length],
                ['Skills', (data.skills || []).reduce((n, c) => n + ((c.items || []).length), 0)],
                ['Education', (data.education || []).length],
                ['Achievements', (data.achievements || []).length],
                ['Interests', (data.interests || []).length],
                ['Stats', (data.stats || []).length],
                ['Social links', ((data.profile || {}).social || []).length],
            ];

            return (
                <div className="space-y-6">
                    <AdminHeading title="Backup & Export" subtitle="Your edits live in this browser only. Save them somewhere safe." />

                    <div className={'glass ' + ADMIN_CARD} style={ADMIN_CARD_BG}>
                        <h3 className="font-heading text-base font-semibold text-white mb-1">Current Contents</h3>
                        <div className="flex flex-wrap gap-2 mt-3">
                            {counts.map(([label, n]) => (
                                <span key={label} className="px-2.5 py-1 rounded-lg bg-slate-800/60 text-xs text-slate-300">
                                    {label}: <span className="text-primary font-semibold">{n}</span>
                                </span>
                            ))}
                        </div>
                    </div>

                    {status && (
                        <div className={'px-4 py-3 rounded-xl text-sm ' + (status.type === 'err' ? 'bg-red-500/10 text-red-300 border border-red-500/30' : status.type === 'warn' ? 'bg-amber-500/10 text-amber-200 border border-amber-500/30' : 'bg-emerald-500/10 text-emerald-300 border border-emerald-500/30')}>
                            {status.text}
                        </div>
                    )}

                    <div className={'glass ' + ADMIN_CARD} style={ADMIN_CARD_BG}>
                        <h3 className="font-heading text-base font-semibold text-white mb-1">Save Permanently</h3>
                        <p className="text-sm text-slate-400 mb-4">
                            Downloads a copy of <span className="font-mono text-slate-300">index.html</span> with your current content written
                            into it as the built-in defaults. Replace the original file with it and your changes are permanent and visible to
                            every visitor.
                        </p>
                        <button onClick={downloadHTML} disabled={busy === 'html'}
                            className="px-5 py-2.5 rounded-xl text-white font-semibold bg-gradient-to-r from-primary to-secondary hover:shadow-lg hover:shadow-primary/30 transition-all text-sm disabled:opacity-60">
                            {busy === 'html' ? 'Building...' : 'Download Updated index.html'}
                        </button>
                        <p className="text-[11px] text-slate-500 mt-3">
                            Tip: if you opened this file directly from disk, the browser blocks reading the original source. Run a local server
                            (for example <span className="font-mono">npx serve</span>) for a byte-perfect download.
                        </p>
                    </div>

                    <div className={'glass ' + ADMIN_CARD} style={ADMIN_CARD_BG}>
                        <h3 className="font-heading text-base font-semibold text-white mb-1">Export / Import JSON</h3>
                        <p className="text-sm text-slate-400 mb-4">Move your content between browsers, devices or backups.</p>
                        <div className="flex flex-wrap gap-2">
                            <AdminPillButton tone="blue" onClick={exportJSON}>Export JSON</AdminPillButton>
                            <AdminPillButton tone="blue" onClick={copyJSON}>Copy to Clipboard</AdminPillButton>
                            <AdminPillButton tone="green" onClick={() => fileRef.current && fileRef.current.click()}>Import JSON</AdminPillButton>
                            <input ref={fileRef} type="file" accept="application/json,.json" className="hidden"
                                onChange={e => { const f = e.target.files && e.target.files[0]; if (f) importJSON(f); e.target.value = ''; }} />
                        </div>
                    </div>

                    <div className={'glass ' + ADMIN_CARD} style={ADMIN_CARD_BG}>
                        <h3 className="font-heading text-base font-semibold text-white mb-4">Danger Zone</h3>
                        <div className="space-y-3">
                            <div className="flex flex-wrap items-center justify-between gap-3">
                                <div className="min-w-0">
                                    <p className="text-sm text-slate-200">Clear browser data</p>
                                    <p className="text-[11px] text-slate-500">Discards this browser's saved copy so the file's baked-in defaults are used.</p>
                                </div>
                                <AdminSaveButton variant="ghost" label="Clear" onClick={clearOverride} />
                            </div>
                            <div className="flex flex-wrap items-center justify-between gap-3">
                                <div className="min-w-0">
                                    <p className="text-sm text-slate-200">Reset all content</p>
                                    <p className="text-[11px] text-slate-500">Restores every section to the original defaults.</p>
                                </div>
                                <AdminSaveButton variant="danger" label="Reset to Defaults" onClick={resetDefaults} />
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function AdminSettings() {
            const [auth, setAuth] = useState(loadAdmin() || { username: 'admin', password: 'thuva@2003' });
            const [f, setF] = useState({ username: auth.username, password: '', confirm: '' });
            const [msg, setMsg] = useState('');
            const saveAuth = () => {
                if (f.password && f.password !== f.confirm) { setMsg('Passwords do not match.'); return; }
                if (!f.username.trim()) { setMsg('Username cannot be empty.'); return; }
                if (f.password && f.password.length < 6) { setMsg('Use at least 6 characters.'); return; }
                const updated = { username: f.username.trim(), password: f.password || auth.password };
                setAuth(updated);
                saveAdmin(updated);
                setF({ ...f, password: '', confirm: '' });
                setMsg('');
                showToast('Credentials updated!');
            };
            return (
                <div className="space-y-6">
                    <AdminHeading title="Settings" subtitle="Admin sign-in credentials" />
                    <div className={'glass ' + ADMIN_CARD} style={ADMIN_CARD_BG}>
                        <h3 className="font-heading text-base font-semibold text-white mb-4">Admin Credentials</h3>
                        {msg && <p className="text-red-400 text-sm mb-3">{msg}</p>}
                        <div className="grid sm:grid-cols-2 gap-4">
                            <AdminField label="Username">
                                <AdminInput value={f.username} onChange={v => setF(s => ({ ...s, username: v }))} />
                            </AdminField>
                            <AdminField label="New Password" hint="Leave blank to keep current.">
                                <AdminInput type="password" value={f.password} onChange={v => setF(s => ({ ...s, password: v }))} />
                            </AdminField>
                            <AdminField label="Confirm Password">
                                <AdminInput type="password" value={f.confirm} onChange={v => setF(s => ({ ...s, confirm: v }))} />
                            </AdminField>
                        </div>
                        <div className="mt-4">
                            <AdminSaveButton onClick={saveAuth} label="Update Credentials" />
                        </div>
                        <p className="text-[11px] text-slate-500 mt-4">
                            Credentials are stored in this browser only. Anyone with the file can still read them, so keep them private and
                            change them if the site is published.
                        </p>
                    </div>
                    <div className={'glass ' + ADMIN_CARD} style={ADMIN_CARD_BG}>
                        <h3 className="font-heading text-base font-semibold text-white mb-2">About the Admin Panel</h3>
                        <p className="text-sm text-slate-400">
                            Open the panel at <span className="font-mono text-slate-300">index.html#admin</span>. The default sign-in is
                            <span className="font-mono text-slate-300"> admin / thuva@2003</span> &mdash; change it here before publishing.
                        </p>
                    </div>
                </div>
            );
        }

        function PublicPortfolio() {
            return (
                <div className="relative">
                    <Navbar />
                    <Hero />
                    <About />
                    <Skills />
                    <Projects />
                    <Education />
                    <Achievements />
                    <ContactSection />
                    <Footer />
                </div>
            );
        }

        // === APP ===
        function App() {
            const [data, setDataState] = useState(getData);
            const [theme, setTheme] = useState(() => {
                const mode = (DEFAULT_DATA.theme && DEFAULT_DATA.theme.defaultMode) || 'dark';
                try { return localStorage.getItem('portfolio-theme') || mode; } catch { return mode; }
            });
            const [page, setPage] = useState('portfolio');
            const [dataVersion, setDataVersion] = useState(0);

            const updateData = useCallback((newData) => {
                setDataState(newData);
                saveData(newData);
                setDataVersion(v => v + 1);
            }, []);

            useEffect(() => {
                const root = document.documentElement;
                if (theme === 'dark') { root.classList.add('dark'); root.classList.remove('light'); }
                else { root.classList.remove('dark'); root.classList.add('light'); }
                try { localStorage.setItem('portfolio-theme', theme); } catch {}
            }, [theme]);

            // Apply SEO / meta tags from editable data
            useEffect(() => {
                const s = data.site || {};
                const setMeta = (sel, attr, value) => {
                    if (!value) return;
                    let el = document.head.querySelector(sel);
                    if (!el) { el = document.createElement('meta'); document.head.appendChild(el); }
                    el.setAttribute(attr, value);
                };
                if (s.title) document.title = s.title;
                setMeta('meta[name="description"]', 'content', s.description);
                setMeta('meta[name="keywords"]', 'content', s.keywords);
                setMeta('meta[property="og:title"]', 'content', s.ogTitle);
                setMeta('meta[property="og:description"]', 'content', s.ogDescription);
            }, [data.site]);

            // Apply brand colours + fonts live (Tailwind Play CDN re-scans the DOM)
            useEffect(() => {
                const t = data.theme || {};
                const root = document.documentElement.style;
                if (t.primary) root.setProperty('--primary', t.primary);
                if (t.secondary) root.setProperty('--secondary', t.secondary);
                if (t.accent) root.setProperty('--accent', t.accent);
                if (window.tailwind && t.primary && t.secondary && t.accent) {
                    try {
                        window.tailwind.config.theme.extend.colors.primary = t.primary;
                        window.tailwind.config.theme.extend.colors.secondary = t.secondary;
                        window.tailwind.config.theme.extend.colors.accent = t.accent;
                    } catch (e) {}
                }
                if (t.headingFont) {
                    const link = document.getElementById('fontHeadingLink');
                    if (link) link.href = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(t.headingFont).replace(/%20/g, '+') + ':wght@400;500;600;700;800&display=swap';
                }
                if (t.bodyFont) {
                    const link = document.getElementById('fontBodyLink');
                    if (link) link.href = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(t.bodyFont).replace(/%20/g, '+') + ':wght@300;400;500;600;700;800&display=swap';
                }
            }, [data.theme]);

            useEffect(() => {
                const onHash = () => {
                    const hash = window.location.hash;
                    if (hash === '#admin') {
                        setPage('admin-login');
                    } else if (hash === '#admin/dashboard') {
                        if (loadAdmin()) setPage('admin-dashboard');
                        else { window.location.hash = '#admin'; }
                    } else {
                        setPage('portfolio');
                    }
                };
                onHash();
                window.addEventListener('hashchange', onHash);
                return () => window.removeEventListener('hashchange', onHash);
            }, []);

            const toggleTheme = useCallback(() => setTheme(t => t === 'dark' ? 'light' : 'dark'), []);
            const handleLogin = () => { window.location.hash = 'admin/dashboard'; };
            const handleLogout = () => { window.location.hash = ''; };

            useScrollProgress();
            useParticles();

            return (
                <ThemeContext.Provider value={{ theme, toggleTheme }}>
                    <DataContext.Provider value={{ data, updateData }}>
                        {page === 'admin-login' && <AdminLogin onLogin={handleLogin} />}
                        {page === 'admin-dashboard' && <AdminDashboard onLogout={handleLogout} />}
                        {page === 'portfolio' && <PublicPortfolio />}
                    </DataContext.Provider>
                </ThemeContext.Provider>
            );
        }

        // === RENDER ===
        try {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(React.createElement(App));
        } catch (err) {
            document.getElementById('loadingScreen').classList.add('hidden');
            var es = document.getElementById('errorScreen');
            var em = document.getElementById('errorMsg');
            if (es && em) {
                em.textContent = err.stack || err.message || String(err);
                es.style.display = 'flex';
                es.style.alignItems = 'center';
                es.style.justifyContent = 'center';
                es.style.flexDirection = 'column';
            }
        }
    </script>
</body>
</html>
